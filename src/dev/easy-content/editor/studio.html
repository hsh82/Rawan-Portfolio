<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Easy Content Studio</title>
    <style>
      :root{color-scheme:light;--bg:#f8fafc;--panel:#fff;--soft:#f1f5f9;--ink:#102039;--muted:#61718a;--border:#dbe4ee;--brand:#087ef0;--danger:#b42318;font-family:Vazirmatn,ui-sans-serif,system-ui,sans-serif}html.dark{color-scheme:dark;--bg:#0d1117;--panel:#111827;--soft:#172235;--ink:#f8fafc;--muted:#aab8ca;--border:#334155}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5}.skip{position:absolute;left:-999px}.skip:focus{left:1rem;top:1rem;z-index:4;background:var(--panel);padding:.5rem}.top{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 1rem;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(12px)}.top__group,.actions,.tabs{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}.shell{display:grid;grid-template-columns:17rem minmax(0,1fr) minmax(18rem,.8fr);gap:1rem;width:min(100% - 2rem,1580px);margin:1rem auto}.panel{min-width:0;border:1px solid var(--border);border-radius:1rem;background:var(--panel);box-shadow:0 1rem 3rem rgb(15 23 42 / .06)}.nav{padding:1rem;align-self:start;position:sticky;top:4.8rem}.nav h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:1rem 0 .4rem}.nav h2:first-child{margin-top:0}.nav a{display:block;padding:.45rem .55rem;border-radius:.45rem;text-decoration:none;color:var(--ink)}.nav a:hover,.nav a[aria-current="page"]{background:var(--soft);color:var(--brand)}.editor{padding:1rem}.preview{overflow:hidden;align-self:start;position:sticky;top:4.8rem}.preview__bar{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.75rem;border-bottom:1px solid var(--border)}.preview iframe{display:block;width:100%;height:calc(100vh - 7rem);min-height:38rem;border:0;background:#fff}.button,.tab{border:1px solid var(--border);border-radius:.55rem;background:var(--panel);color:var(--ink);padding:.45rem .7rem;font:inherit;cursor:pointer;text-decoration:none}.button:hover,.tab:hover{border-color:var(--brand)}.button.primary{background:var(--brand);border-color:var(--brand);color:#fff}.button.danger{border-color:var(--danger);color:var(--danger)}.button:focus-visible,.tab:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}.heading{margin:.2rem 0;font-size:1.35rem}.lede,.help,.empty{color:var(--muted)}.tabs{margin:1rem 0;border-bottom:1px solid var(--border)}.tab{border-radius:.55rem .55rem 0 0;border-bottom:0}.tab[aria-selected="true"]{background:var(--soft);color:var(--brand)}.fields{display:grid;gap:.85rem}.field{display:grid;gap:.3rem;font-size:.84rem;font-weight:650}.field input,.field textarea{width:100%;border:1px solid var(--border);border-radius:.5rem;padding:.55rem;color:var(--ink);background:var(--panel);font:inherit;font-weight:400}.field textarea{min-height:5.5rem;resize:vertical}.field.checkbox{grid-template-columns:auto 1fr;align-items:center;font-weight:500}.source{width:100%;min-height:32rem;padding:1rem;border:1px solid var(--border);border-radius:.6rem;background:var(--panel);color:var(--ink);font:.85rem/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical}.hidden{display:none!important}.status{min-height:1.5rem;color:var(--muted);font-size:.85rem}.status.error{color:var(--danger)}.item-list{display:grid;gap:.5rem;margin-top:1rem}.item-list button{display:flex;justify-content:space-between;text-align:left}.notice{padding:.7rem .8rem;border:1px solid color-mix(in srgb,var(--brand) 30%,var(--border));border-radius:.6rem;background:var(--soft);font-size:.86rem}.preview-select{max-width:8rem;background:var(--panel);color:var(--ink);border:1px solid var(--border);border-radius:.4rem;padding:.35rem}@media(max-width:1180px){.shell{grid-template-columns:15rem minmax(0,1fr)}.preview{grid-column:1/-1;position:static}.preview iframe{height:42rem}}@media(max-width:720px){.top{align-items:flex-start;flex-direction:column}.shell{display:block;width:min(100% - 1rem,1580px)}.nav,.preview{position:static;margin-bottom:1rem}.nav{max-height:15rem;overflow:auto}.preview iframe{height:35rem;min-height:0}.top__group,.actions{width:100%}}
    </style>
  </head>
  <body>
    <a class="skip" href="#studio-main">Skip to editor</a>
    <header class="top"><div class="top__group"><a class="button" href="/en/">← Site</a><strong>Easy Content Studio</strong></div><div class="actions"><span id="state" class="status" aria-live="polite">Loading…</span><button id="theme" class="button" type="button" aria-label="Toggle editor theme">◐</button><button id="save" class="button primary" type="button">Save Changes</button></div></header>
    <main id="studio-main" class="shell"><nav class="panel nav" id="catalog" aria-label="Content resources"><p class="empty">Loading resources…</p></nav><section class="panel editor"><div id="empty"><h1 class="heading">Content Studio</h1><p class="lede">Choose a canonical content file or record. Changes stay in your local working tree until you commit them.</p></div><div id="workspace" class="hidden"><div class="actions" style="justify-content:space-between"><div><p id="crumb" class="help"></p><h1 id="title" class="heading"></h1></div><div class="actions"><button id="new" class="button hidden" type="button">New Item</button><button id="delete" class="button danger hidden" type="button">Delete</button></div></div><p id="description" class="lede"></p><div class="tabs" role="tablist" aria-label="Editor sections"><button class="tab" data-tab="general" role="tab" aria-selected="true">General</button><button class="tab" data-tab="en" role="tab" aria-selected="false">English</button><button class="tab" data-tab="fa" role="tab" aria-selected="false">فارسی</button><button class="tab" data-tab="source" role="tab" aria-selected="false">JSON Source</button></div><div id="form" class="fields"></div><textarea id="source" class="source hidden" aria-label="JSON source" spellcheck="false" autocomplete="off"></textarea><p id="message" class="status" aria-live="polite"></p></div></section><aside class="panel preview"><div class="preview__bar"><strong>Real Site Preview</strong><div class="actions"><select id="preview-locale" class="preview-select" aria-label="Preview language"><option value="en">English</option><option value="fa">فارسی</option></select><button id="refresh-preview" class="button" type="button">Refresh</button></div></div><iframe id="preview" title="Read-only portfolio preview" sandbox="allow-same-origin" referrerpolicy="no-referrer"></iframe></aside></main>
    <script type="module" src="/__easy-content/studio.js"></script>
  </body>
</html>
