<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Easy Content Studio</title>
    <style>
      :root{color-scheme:light;--bg:#f8fafc;--panel:#fff;--soft:#f1f5f9;--ink:#102039;--muted:#61718a;--border:#dbe4ee;--brand:#087ef0;--danger:#b42318;font-family:Vazirmatn,ui-sans-serif,system-ui,sans-serif}html.dark{color-scheme:dark;--bg:#0d1117;--panel:#111827;--soft:#172235;--ink:#f8fafc;--muted:#aab8ca;--border:#334155}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5}.skip{position:absolute;left:-999px}.skip:focus{left:1rem;top:1rem;z-index:4;background:var(--panel);padding:.5rem}.top{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 1rem;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(12px)}.top__group,.actions,.tabs{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}.shell{display:grid;grid-template-columns:17rem minmax(0,1fr) minmax(18rem,.8fr);gap:1rem;width:min(100% - 2rem,1580px);margin:1rem auto}.panel{min-width:0;border:1px solid var(--border);border-radius:1rem;background:var(--panel);box-shadow:0 1rem 3rem rgb(15 23 42 / .06)}.nav{padding:1rem;align-self:start;position:sticky;top:4.8rem}.nav h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:1rem 0 .4rem}.nav h2:first-child{margin-top:0}.nav a{display:block;padding:.45rem .55rem;border-radius:.45rem;text-decoration:none;color:var(--ink)}.nav a:hover,.nav a[aria-current="page"]{background:var(--soft);color:var(--brand)}.editor{padding:1rem}.preview{overflow:hidden;align-self:start;position:sticky;top:4.8rem}.preview__bar{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.75rem;border-bottom:1px solid var(--border)}.preview iframe{display:block;width:100%;height:calc(100vh - 7rem);min-height:38rem;border:0;background:#fff}.button,.tab{border:1px solid var(--border);border-radius:.55rem;background:var(--panel);color:var(--ink);padding:.45rem .7rem;font:inherit;cursor:pointer;text-decoration:none}.button:hover,.tab:hover{border-color:var(--brand)}.button.primary{background:var(--brand);border-color:var(--brand);color:#fff}.button.danger{border-color:var(--danger);color:var(--danger)}.button:focus-visible,.tab:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}.heading{margin:.2rem 0;font-size:1.35rem}.lede,.help,.empty{color:var(--muted)}.tabs{margin:1rem 0;border-bottom:1px solid var(--border)}.tab{border-radius:.55rem .55rem 0 0;border-bottom:0}.tab[aria-selected="true"]{background:var(--soft);color:var(--brand)}.fields{display:grid;gap:.85rem}.field{display:grid;gap:.3rem;font-size:.84rem;font-weight:650}.field input,.field textarea{width:100%;border:1px solid var(--border);border-radius:.5rem;padding:.55rem;color:var(--ink);background:var(--panel);font:inherit;font-weight:400}.field textarea{min-height:5.5rem;resize:vertical}.field.checkbox{grid-template-columns:auto 1fr;align-items:center;font-weight:500}.source{width:100%;min-height:32rem;padding:1rem;border:1px solid var(--border);border-radius:.6rem;background:var(--panel);color:var(--ink);font:.85rem/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical}.hidden{display:none!important}.status{min-height:1.5rem;color:var(--muted);font-size:.85rem}.status.error{color:var(--danger)}.item-list{display:grid;gap:.5rem;margin-top:1rem}.item-list button{display:flex;justify-content:space-between;text-align:left}.notice{padding:.7rem .8rem;border:1px solid color-mix(in srgb,var(--brand) 30%,var(--border));border-radius:.6rem;background:var(--soft);font-size:.86rem}.preview-select{max-width:8rem;background:var(--panel);color:var(--ink);border:1px solid var(--border);border-radius:.4rem;padding:.35rem}.ai-guide{margin:1rem 0;padding:1rem;border:1px solid color-mix(in srgb,var(--brand) 28%,var(--border));border-radius:.75rem;background:var(--soft)}.ai-guide__context,.ai-guide__help,.ai-guide__status{color:var(--muted);font-size:.78rem}.ai-guide__details{margin:.8rem 0}.ai-guide__details summary{cursor:pointer;color:var(--brand);font-size:.8rem;font-weight:650}.ai-guide__prompt{display:block;width:100%;min-height:20rem;max-height:34rem;margin-top:.55rem;padding:.75rem;border:1px solid var(--border);border-radius:.5rem;background:var(--panel);color:var(--ink);font:.72rem/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;direction:ltr;text-align:left;resize:vertical}.ai-guide__copy{width:100%}.ai-guide__copy:disabled{cursor:wait;opacity:.7}@media(max-width:1180px){.shell{grid-template-columns:15rem minmax(0,1fr)}.preview{grid-column:1/-1;position:static}.preview iframe{height:42rem}}@media(max-width:720px){.top{align-items:flex-start;flex-direction:column}.shell{display:block;width:min(100% - 1rem,1580px)}.nav,.preview{position:static;margin-bottom:1rem}.nav{max-height:15rem;overflow:auto}.preview iframe{height:35rem;min-height:0}.top__group,.actions{width:100%}}
    </style>
    <style>
      /* Structured resources are edited as canonical JSON only. Blog/project
         documents use the separate bilingual editor. */
      #workspace .tabs [data-tab="general"],
      #workspace .tabs [data-tab="en"],
      #workspace .tabs [data-tab="fa"] { display: none !important; }
    </style>
<style>
.preview__bar{flex-wrap:wrap}.preview-scroll{overflow:auto;direction:ltr}.preview iframe{width:1280px;max-width:none;height:760px}.preview[data-viewport="mobile"] iframe{width:390px;height:844px}.preview.expanded{position:fixed;inset:1rem;z-index:10;background:var(--panel);overflow:auto;margin:0}.preview.expanded .preview-scroll{height:calc(100% - 8rem)}.preview.expanded iframe{min-width:1280px;height:100%}.preview.expanded[data-viewport="mobile"] iframe{min-width:390px;width:390px;height:844px;margin:auto}.menu{position:absolute;z-index:5;display:grid;gap:.4rem;padding:.6rem;background:var(--panel);border:1px solid var(--border);border-radius:.5rem}dialog{width:min(90vw,54rem);max-height:90vh;overflow:auto;color:var(--ink);background:var(--panel);border:1px solid var(--border);border-radius:1rem}dialog::backdrop{background:#0007}pre,#message{white-space:pre-wrap;overflow-wrap:anywhere}summary:focus-visible{outline:2px solid var(--brand)}
</style></head>
  <body>
    <a class="skip" href="#studio-main">Skip to editor</a>
    <header class="top"><div class="top__group"><a class="button" href="/en/">← Site</a><strong>Easy Content Studio</strong></div><div class="actions"><span id="state" class="status" aria-live="polite">Loading…</span><button id="theme" class="button" type="button" aria-label="Toggle editor theme">◐</button><button id="ai-open" class="button" type="button">AI Assistant</button><details id="more"><summary class="button">More Actions</summary><div class="menu"><button id="validate" class="button" type="button">Validate Content</button><button id="format" class="button" type="button">Format / Repair JSON</button><button id="git" class="button" type="button">View Git Changes</button><button id="restore-id" class="button hidden" type="button">Restore selected ID</button></div></details><button id="save" class="button primary" type="button">Save Changes</button></div></header>
    <main id="studio-main" class="shell"><nav class="panel nav" id="catalog" aria-label="Content resources"><p class="empty">Loading resources…</p></nav><section class="panel editor"><div id="empty"><h1 class="heading">Content Studio</h1><p class="lede">Choose a canonical content file or record. Changes stay in your local working tree until you commit them.</p></div><div id="workspace" class="hidden"><div class="actions" style="justify-content:space-between"><div><p id="crumb" class="help"></p><h1 id="title" class="heading"></h1></div><div class="actions"><button id="new" class="button hidden" type="button">New Item</button><button id="delete" class="button danger hidden" type="button">Delete</button></div></div><p id="description" class="lede"></p><div id="record-list" class="item-list"></div><div class="tabs" role="tablist" aria-label="Editor sections"><button class="tab" data-tab="general" role="tab" aria-selected="true">General</button><button class="tab" data-tab="en" role="tab" aria-selected="false">English</button><button class="tab" data-tab="fa" role="tab" aria-selected="false">فارسی</button><button class="tab" data-tab="source" role="tab" aria-selected="false">JSON Source</button></div><div id="form" class="fields"></div><div id="source-actions" class="actions" aria-label="Source actions"></div><label id="profile-import" class="button hidden">Import portrait<input id="profile-upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><div id="import-tools" class="actions hidden"><select id="import-mode"><option value="append">Append new records</option><option value="update">Update existing records</option></select><button id="import" class="button" type="button">Review import</button></div><ul id="issues" class="error" aria-live="polite"></ul><textarea id="source" class="source hidden" aria-label="JSON source" spellcheck="false" autocomplete="off"></textarea><p id="message" class="status" aria-live="polite"></p></div></section><aside class="panel preview"><div class="preview__bar"><strong>Real Site Preview</strong><div class="actions"><button id="expand-preview" class="button" type="button" aria-expanded="false">Expand preview</button><select id="preview-viewport" class="preview-select" aria-label="Preview viewport"><option value="desktop">Desktop</option><option value="mobile">Mobile</option></select><select id="preview-locale" class="preview-select" aria-label="Preview language"><option value="en">English</option><option value="fa">فارسی</option></select><button id="refresh-preview" class="button" type="button">Refresh</button></div></div><p id="preview-state" class="notice" role="status"></p><div class="preview-scroll"><iframe id="preview" title="Read-only portfolio preview" sandbox="allow-same-origin" referrerpolicy="no-referrer"></iframe></div></aside></main>
    <dialog id="ai-dialog" aria-labelledby="ai-writing-guide-title"><button id="ai-close" class="button" type="button">Close</button><section id="ai-writing-guide" class="ai-guide"></section></dialog>
    <script type="module" src="/__easy-content/studio.js"></script>
  </body>
</html>
