name: Vercel Preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to preview (main or content/*)'
        required: true
        default: content/hamed-sheikhan
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Preview ${{ inputs.ref }}
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Validate deployment ref
        shell: bash
        env:
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          if [[ "$DEPLOY_REF" != "main" && "$DEPLOY_REF" != content/* ]]; then
            echo "Only main or content/* branches may be previewed."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:validate && npm run content:check-links && npm run check
      - run: npx vercel@latest pull --yes --environment=preview --git-branch=${{ inputs.ref }} --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - run: npx vercel@latest build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - id: deploy
        shell: bash
        run: |
          URL="$(npx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview deployment: $URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
