name: Docker images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: hsh82
  SOURCE_REPOSITORY: https://github.com/hsh82/Rawan-Portfolio

jobs:
  verify:
    name: Verify Docker distributions
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and test application
        run: |
          npm run content:validate
          npm run content:check-links
          npm run check
          npm run test:platform
          npm run test:docker
          npm run build
          npm test
          npm run test:smoke

      - name: Configure Chromium for résumé smoke tests
        run: echo "CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"

      - name: Test résumé generation
        run: npm run test:pdf

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build authoring image for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: setup/Dockerfile
          target: authoring
          load: true
          tags: ghcr.io/hsh82/rawan-easy-content:latest
          cache-from: type=gha,scope=rawan-easy-content
          cache-to: type=gha,mode=max,scope=rawan-easy-content

      - name: Build production image for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: setup/Dockerfile
          target: production
          load: true
          tags: ghcr.io/hsh82/rawan-portfolio:latest
          cache-from: type=gha,scope=rawan-portfolio
          cache-to: type=gha,mode=max,scope=rawan-portfolio

      - name: Report high and critical vulnerabilities in production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/hsh82/rawan-portfolio:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Keep visibility without blocking distribution while the upstream
          # Alpine/Nginx package advisories are being cleared.
          exit-code: '0'

      - name: Start authoring container
        run: docker compose -f setup/docker-compose.yml up -d --no-build

      - name: Smoke-test Easy Content and persistence boundary
        run: |
          curl --fail --retry 20 --retry-delay 2 http://127.0.0.1:1234/en/
          curl --fail --retry 20 --retry-delay 2 http://127.0.0.1:1234/fa/
          curl --fail --retry 20 --retry-delay 2 'http://127.0.0.1:1234/__easy-content/api/context?path=/dev/content/'
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose -f setup/docker-compose.yml ps -q easy-content)")" = healthy
          docker compose -f setup/docker-compose.yml exec -T easy-content node -e "import('./setup/authoring-entrypoint.mjs').then(m=>m.initializeContent())"

      - name: Start production container
        run: docker compose -f setup/docker-compose.production.yml up -d --no-build

      - name: Smoke-test immutable production site
        run: |
          curl --fail --retry 20 --retry-delay 2 http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/en/
          curl --fail http://127.0.0.1:8080/fa/
          curl --fail http://127.0.0.1:8080/en/blog/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/this-route-does-not-exist/)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/__easy-content/api/context)" = 404
          ! docker inspect ghcr.io/hsh82/rawan-portfolio:latest --format '{{json .Config.Env}}' 2>/dev/null | grep -q EASY_CONTENT_MODE

      - name: Stop smoke-test containers
        if: always()
        run: |
          docker compose -f setup/docker-compose.yml down --volumes --remove-orphans
          docker compose -f setup/docker-compose.production.yml down --volumes --remove-orphans

  publish:
    name: Publish GHCR images
    needs: verify
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate authoring image metadata
        id: authoring-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hsh82/rawan-easy-content
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_REPOSITORY }}

      - name: Generate production image metadata
        id: production-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hsh82/rawan-portfolio
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_REPOSITORY }}

      - name: Publish authoring image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: setup/Dockerfile
          target: authoring
          push: true
          platforms: linux/amd64
          tags: ${{ steps.authoring-meta.outputs.tags }}
          labels: ${{ steps.authoring-meta.outputs.labels }}
          cache-from: type=gha,scope=rawan-easy-content
          cache-to: type=gha,mode=max,scope=rawan-easy-content
          provenance: mode=max
          sbom: true

      - name: Publish production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: setup/Dockerfile
          target: production
          push: true
          platforms: linux/amd64
          tags: ${{ steps.production-meta.outputs.tags }}
          labels: ${{ steps.production-meta.outputs.labels }}
          cache-from: type=gha,scope=rawan-portfolio
          cache-to: type=gha,mode=max,scope=rawan-portfolio
          provenance: mode=max
          sbom: true
