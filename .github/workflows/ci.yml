name: CI

on:
  pull_request:
  push:
    branches: [main, content/**, update/**, release/**]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:validate
      - run: npm run content:check-links
      - run: npm run check
      - run: npm run build
      - run: npm run test:static
      - run: npm run resume:generate
