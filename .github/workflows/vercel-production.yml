name: Vercel Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to deploy to production (main or content/*)'
        required: true
        default: content/hamed-sheikhan
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Production ${{ inputs.ref }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate deployment ref
        shell: bash
        env:
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          if [[ "$DEPLOY_REF" != "main" && "$DEPLOY_REF" != content/* ]]; then
            echo "Only main or content/* branches may be deployed to production."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:validate && npm run content:check-links && npm run check
      - run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - id: deploy
        shell: bash
        run: |
          URL="$(npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
